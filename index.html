<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSUN Map Quiz</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="container">

    <div id="sidebar">
      <h2>Map Quiz <br> Double click on the map to the right location:</h2>

      <!-- Current question prompt -->
      <div id="current-prompt"></div>

      <!-- Live score bar — updates after each guess -->
      <div id="score-bar">
        <span class="correct-label">✔ <span id="score-correct">0</span></span>
        <span class="wrong-label">X <span id="score-wrong">0</span></span>
        <span class="remain-label">Left: <span id="score-remaining">5</span></span>
      </div>

      <!-- History log — each completed question appended here -->
      <div id="history"></div>

      <!-- Distance feedback — shown after each guess -->
      <div id="distance-msg"></div>

      <!-- Street View panel — hidden until after first guess -->
      <div id="street-view"></div>

      <!-- Live countdown timer — visible during the game -->
      <div id="live-timer">Time: 0s</div>

      <!-- Final score shown after all 5 questions -->
      <div id="final-score"></div>
    </div>

    <div id="map"></div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAczJVb_-U_XpOXDMlE1nODMDv91Qn2vXU&callback=initMap&loading=async"
    async defer>
  </script>

  <script src="script.js"></script>

</body>
</html>
